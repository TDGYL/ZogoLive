        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #050508;
            color: #F2F2F7;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hide scrollbars for clean iOS look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* iOS Screen Transition Animation */
        .screen-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 920px;
            margin: 0 auto;
            background: #0D0E12;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.38s ease;
            will-change: transform, opacity;
            display: flex;
            flex-direction: column;
            background: #0D0E12;
        }

        .screen-main {
            transform: translateX(0);
            z-index: 10;
        }
        .screen-main.pushed {
            transform: translateX(-30%);
            opacity: 0.6;
        }

        .screen-detail {
            transform: translateX(100%);
            z-index: 20;
        }
        .screen-detail.active {
            transform: translateX(0);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        /* Blur Header */
        .ios-blur-header {
            background: rgba(22, 24, 31, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Dynamic Glows */
        .glow-up {
            animation: flashUp 0.8s ease-out;
        }
        .glow-down {
            animation: flashDown 0.8s ease-out;
        }
        @keyframes flashUp {
            0% { background-color: rgba(255, 59, 48, 0.35); }
            100% { background-color: transparent; }
        }
        @keyframes flashDown {
            0% { background-color: rgba(48, 209, 88, 0.35); }
            100% { background-color: transparent; }
        }

        /* Custom Scroll Snap for Timeline */
        .timeline-scroll {
            scroll-behavior: smooth;
        }
    </style>
</head>

            renderTimelineLogs(selectedCompanyId);

            // Back button
            btnBack.addEventListener('click', popDetailScreen);

            // Chart view toggle button
            btnChartToggle.addEventListener('click', () => {
                if (chartSection.classList.contains('hidden')) {
                    chartSection.classList.remove('hidden');
                    btnChartToggle.classList.add('text-ios-accent');
                } else {
                    chartSection.classList.add('hidden');
                    btnChartToggle.classList.remove('text-ios-accent');
                }
            });

            // Segmented tabs listener inside detail view
            document.querySelectorAll('.detail-type-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.detail-type-btn').forEach(b => {
                        b.classList.remove('text-white', 'bg-ios-card', 'shadow', 'font-bold');
                        b.classList.add('text-ios-subtext', 'font-medium');
                    });
                    const target = e.currentTarget;
                    target.classList.add('text-white', 'bg-ios-card', 'shadow', 'font-bold');
                    target.classList.remove('text-ios-subtext', 'font-medium');
                    
                    currentOddsType = target.dataset.type;
                    renderTimelineLogs(selectedCompanyId);
                });
            });
        });

        // Clock display
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('ios-clock').textContent = `${hours}:${minutes}`;
        }

        // Navigation: Push Screen
        function pushDetailScreen(companyId) {
            selectedCompanyId = companyId;
            updateDetailHeader();
            renderCompanySidebar();
            renderTimelineLogs(companyId);

            screenMain.classList.add('pushed');
            screenDetail.classList.add('active');
        }

        // Navigation: Pop Screen
        function popDetailScreen() {
            screenDetail.classList.remove('active');
            screenMain.classList.remove('pushed');
        }

        function renderMainIndexList() {
            indexListContainer.innerHTML = '';
            companiesData.forEach(comp => {
                const row = document.createElement('div');
                row.className = 'px-4 py-3.5 flex items-center justify-between hover:bg-ios-card/50 active:bg-ios-card transition-colors cursor-pointer';
                
                const isUp = comp.instant.trend === 'up';
                const trendColor = isUp ? 'text-ios-up' : 'text-ios-down';
                const trendArrow = isUp ? '▲' : '▼';

                row.innerHTML = `
                    <div class="w-1/4 flex items-center gap-1.5">
                        <i class="fa-solid fa-star text-[10px] ${comp.isFav ? 'text-amber-400' : 'text-neutral-700'}"></i>
                        <span class="text-xs font-semibold text-white truncate">${comp.name}</span>
                    </div>
                    <div class="w-1/3 text-center font-mono text-[11px] text-ios-subtext">
                        <span>${comp.initial.home}</span>
                        <span class="px-1 text-neutral-400">${comp.initial.handicap}</span>
                        <span>${comp.initial.away}</span>
                    </div>
                    <div class="w-1/3 text-right font-mono text-[11px] font-bold">
                        <span class="${trendColor}">${comp.instant.home} ${trendArrow}</span>
                        <span class="px-1 text-white">${comp.instant.handicap}</span>
                        <span class="text-ios-subtext">${comp.instant.away}</span>
                    </div>
                `;

                row.addEventListener('click', () => {
                    pushDetailScreen(comp.id);
                });

                indexListContainer.appendChild(row);
            });
        }

        // Update detail screen header
        function updateDetailHeader() {
            const comp = companiesData.find(c => c.id === selectedCompanyId) || companiesData[0];
            document.getElementById('detail-header-company').textContent = comp.name;
            document.getElementById('summary-home-odds').textContent = `${comp.instant.home} ▲`;
            document.getElementById('summary-handicap').textContent = comp.instant.handicap;
            document.getElementById('summary-away-odds').textContent = `${comp.instant.away} ▼`;
            
            const starIcon = document.getElementById('btn-toggle-favorite').querySelector('i');
            if(comp.isFav) {
                starIcon.className = "fa-solid fa-star text-amber-400";
            } else {
                starIcon.className = "fa-regular fa-star";
            }
        }

        function renderCompanySidebar() {
            companySidebarList.innerHTML = '';
            companiesData.forEach(comp => {
                const isSelected = comp.id === selectedCompanyId;
                const btn = document.createElement('button');
                btn.className = `w-full py-3 px-2 text-center flex flex-col items-center justify-center transition-all ${
                    isSelected 
                        ? 'bg-ios-card border-l-4 border-ios-accent text-white font-bold shadow-inner' 
                        : 'text-ios-subtext hover:text-white hover:bg-neutral-900/50'
                }`;

                btn.innerHTML = `
                    <span class="text-[11px] truncate w-full">${comp.name}</span>
                    <span class="text-[9px] font-mono mt-0.5 ${comp.instant.trend === 'up' ? 'text-ios-up' : 'text-ios-down'}">
                        ${comp.instant.handicap}
                    </span>
                `;

                btn.addEventListener('click', () => {
                    selectedCompanyId = comp.id;
                    updateDetailHeader();
                    renderCompanySidebar();
                    renderTimelineLogs(comp.id);
                });

                companySidebarList.appendChild(btn);
            });
        }

        function renderTimelineLogs(companyId) {
            timelineLogContainer.innerHTML = '';
            const comp = companiesData.find(c => c.id === companyId) || companiesData[0];

            comp.timeline.forEach((item, index) => {
                const logRow = document.createElement('div');
                
                // Color coding for odds movement
                let homeOddsClass = "text-gray-300";
                let awayOddsClass = "text-gray-300";
                let arrow = "";

                if (item.status === 'up') {
                    homeOddsClass = "text-ios-up font-bold";
                    awayOddsClass = "text-ios-down font-medium";
                    arrow = "▲";
                } else if (item.status === 'down') {
                    homeOddsClass = "text-ios-down font-medium";
                    awayOddsClass = "text-ios-up font-bold";
                    arrow = "▼";
                }

                // Render Goal Event Marker
                if (item.isGoal) {
                    const goalBanner = document.createElement('div');
                    goalBanner.className = "my-1 px-3 py-1 bg-red-500/15 border border-red-500/30 rounded-xl flex items-center justify-between text-xs text-red-400 font-medium";
                    goalBanner.innerHTML = `
                        <div class="flex items-center gap-1.5">
                            <i class="fa-solid fa-futbol animate-spin"></i>
                            <span>进球 ! ${item.goalTeam || ''} (${item.score})</span>
                        </div>
                        <span class="font-mono text-[10px]">${item.time}</span>
                    `;
                    timelineLogContainer.appendChild(goalBanner);
                }

                logRow.className = `p-2.5 rounded-xl border border-ios-cardBorder/60 bg-ios-card/70 flex items-center justify-between text-xs font-mono relative overflow-hidden ${index === 0 ? 'ring-1 ring-ios-accent/50 glow-up' : ''}`;
                
                logRow.innerHTML = `
                    <!-- Time & Score -->
                    <div class="w-14 flex flex-col justify-center">
                        <span class="text-[11px] font-bold text-white">${item.time}</span>
                        <span class="text-[9px] text-ios-subtext">${item.score}</span>
                    </div>

                    <!-- Home Odds -->
                    <div class="flex-1 text-center font-bold ${homeOddsClass}">
                        ${item.home} ${item.status === 'up' ? '<span class="text-[9px]">▲</span>' : ''}
                    </div>

                    <!-- Handicap Line -->
                    <div class="w-16 text-center">
                        <span class="px-1.5 py-0.5 bg-neutral-900 border border-neutral-700/80 rounded text-[10px] font-semibold text-white">
                            ${item.handicap}
                        </span>
                    </div>

                    <!-- Away Odds -->
                    <div class="flex-1 text-center ${awayOddsClass}">
                        ${item.away} ${item.status === 'down' ? '<span class="text-[9px]">▼</span>' : ''}
                    </div>
                `;

                timelineLogContainer.appendChild(logRow);
            });
        }
    </script>
</body>
</html>
